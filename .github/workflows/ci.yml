name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: |
          set -o pipefail
          pytest -q 2>/dev/null | tee test_output.txt

      - name: Generate synthetic feed
        run: |
          set -o pipefail
          python -m src.generator | tee generator_output.txt

      - name: Run pipeline end to end
        run: |
          set -o pipefail
          python -m src.pipeline 2>/dev/null | tee pipeline_output.txt

      - name: Assert reconciliation passed
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open("data/out/run_metrics.json"))
          status = m["reconciliation"]["status"]
          print(f"run_id={m['run_id']} alerts={m['alert_count']} "
                f"alert_rate={m['alert_rate_pct']}% recon={status}")
          if status != "PASS":
              sys.exit("Reconciliation FAILED")
          PY

      # Renders the real output of this run onto the Actions summary page,
      # so the pipeline's own report is visible without opening the logs.
      - name: Publish run report
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os


          def read(path):
              try:
                  with open(path, encoding="utf-8") as fh:
                      return fh.read().strip()
              except OSError:
                  return ""


          print("# Real-Time Transaction Fraud Monitoring Engine")
          print()
          print("Output of this run. Every figure below was produced by the "
                "pipeline in this job, not written by hand.")
          print()

          try:
              with open("data/out/run_metrics.json", encoding="utf-8") as fh:
                  m = json.load(fh)
          except OSError:
              m = None

          if m:
              r = m["reconciliation"]
              status = r["status"]
              badge = "PASS" if status == "PASS" else "FAIL"

              print("## Reconciliation")
              print()
              print("| Measure | Value |")
              print("|---|---|")
              print(f"| Source rows | {r['source_count']:,} |")
              print(f"| Clean rows | {r['clean_count']:,} |")
              print(f"| Quarantined rows | {r['quarantined_count']:,} |")
              print(f"| **Count break** | **{r['count_break']:,}** |")
              print(f"| Source amount | {r['source_amount']:,.2f} |")
              print(f"| Clean + quarantined | {r['split_amount']:,.2f} |")
              print(f"| **Amount break** | **{r['amount_break']:,.2f}** |")
              print(f"| **Status** | **{badge}** |")
              print()

              print("## Alerts")
              print()
              print("| Measure | Value |")
              print("|---|---|")
              print(f"| Run id | `{m['run_id']}` |")
              print(f"| Alerts raised | {m['alert_count']:,} |")
              print(f"| Alert rate | {m['alert_rate_pct']}% |")
              print()

          pipeline = read("pipeline_output.txt")
          if pipeline:
              print("## Pipeline console report")
              print()
              print("```text")
              print(pipeline)
              print("```")
              print()

          tests = read("test_output.txt")
          if tests:
              print("## Test suite")
              print()
              print("```text")
              print(tests)
              print("```")
              print()

          print("---")
          print()
          print("Source: "
                "[tharuntellabati/realtime-fraud-monitoring]"
                "(https://github.com/tharuntellabati/realtime-fraud-monitoring)")
          PY

      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-run-report
          path: |
            pipeline_output.txt
            test_output.txt
            data/out/run_metrics.json
          if-no-files-found: warn
