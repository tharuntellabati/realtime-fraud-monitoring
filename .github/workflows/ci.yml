name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest -q

      - name: Generate synthetic feed
        run: python -m src.generator

      - name: Run pipeline end to end
        run: python -m src.pipeline

      - name: Assert reconciliation passed
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open("data/out/run_metrics.json"))
          status = m["reconciliation"]["status"]
          print(f"run_id={m['run_id']} alerts={m['alert_count']} "
                f"alert_rate={m['alert_rate_pct']}% recon={status}")
          if status != "PASS":
              sys.exit("Reconciliation FAILED")
          PY
